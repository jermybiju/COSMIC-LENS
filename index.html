<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cosmic lens</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="stars-bg"></div>

<div class="app">
<div class="header">
<h1 class="logo-text">COSMIC LENS</h1>
<p class="tagline">a daily look at our universe from NASA</p>
</div>

<div class="controls">
<div class="control-group">
<label>date</label>
<input type="date" id="datePicker">
</div>
<button class="btn" id="prevBtn">←</button>
<button class="btn" id="randomBtn">random</button>
<button class="btn" id="todayBtn">today</button>
<button class="btn" id="nextBtn">→</button>
<button class="btn" id="shareBtn">share</button>
<button class="btn btn-fav" id="favBtn">☆</button>
</div>

<div class="apod-card" id="apodCard">
<div class="loading">loading...</div>
</div>

<h2 class="section-title">favorites</h2>
<div class="favorites-grid" id="favoritesGrid"></div>

<div class="footer">
<p>made with the NASA APOD API</p>
<p><a href="https://github.com/jermybiju">github</a> , <a href="mailto:jermybiju00@gmail.com">email</a></p>
<p>built by jermy biju</p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
